name: Import complete source

on:
  push:
    branches: [main]
    paths:
      - project-source.tar.gz

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Extract project files
        run: tar -xzf project-source.tar.gz

      - name: Commit imported source
        run: |
          rm project-source.tar.gz .github/workflows/import-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import complete portfolio source"
          git push origin main
